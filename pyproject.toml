[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agoo"
version = "0.1.0"
description = "Python client for the agOO remote storage service"
requires-python = ">=3.10"

# Runtime dependency: the requests library replaces Perl's LWP::UserAgent.
# All other dependencies (json, os, re, time, subprocess, pathlib, urllib.parse)
# are part of the Python standard library.
dependencies = [
    "requests>=2.28",
]
